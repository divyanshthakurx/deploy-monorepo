name: Deploy the backend

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with: 
          context: .
          file: ./docker/Dockerfile.backend
          push: true
          tags: divyanshthakurx/deploy-monorepo-backend:${{ github.sha }}

      - name: Deploy Docker container via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@3.7.66.165 "docker pull divyanshthakurx/deploy-monorepo-backend:${{ github.sha }} && docker stop backend || true && docker rm backend || true && docker run --name backend --restart always -d -p 8080:8080 divyanshthakurx/deploy-monorepo-backend:${{ github.sha }} && docker image prune -af"

